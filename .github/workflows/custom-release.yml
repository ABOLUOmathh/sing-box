name: Full-Matrix Release (iOS TrollStore, Android APK, Core & Packages)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.14.4-hx.3)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-ios:
    name: Build iOS TrollStore IPA & Libbox
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select Xcode 16
        run: |
          if [ -d /Applications/Xcode_16.4.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app
          elif [ -d /Applications/Xcode_16.3.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.3.app
          elif [ -d /Applications/Xcode_16.2.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          elif [ -d /Applications/Xcode_16.1.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          else
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: false

      - name: Install Apple build tools
        run: |
          brew install dpkg ldid
          make lib_install
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Determine Version
        id: version_step
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG_NAME="${{ github.event.inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
          else
            TAG_NAME="v1.14.4-hx.3"
          fi
          VERSION="${TAG_NAME#v}"
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Apply Apple customization patch
        run: |
          if [ -f .github/apple_custom.patch ]; then
            echo "Applying apple_custom.patch..."
            cd clients/apple
            git apply --verbose ../../.github/apple_custom.patch
            cd ../..
          fi

      - name: Build Libbox.xcframework (iOS 15.0+)
        run: |
          export PATH="$PATH:$HOME/go/bin"
          go run ./cmd/internal/build_libbox -target apple -platform ios
          rm -rf clients/apple/Libbox.xcframework
          cp -R Libbox.xcframework clients/apple/Libbox.xcframework
          mkdir -p ios-dist
          zip -qry9 "ios-dist/Libbox-HX-${VERSION}.xcframework.zip" Libbox.xcframework

      - name: Package iOS TrollStore & Sideload IPA
        run: |
          chmod +x .github/package_ipa.sh
          .github/package_ipa.sh "${{ env.VERSION }}"
          cp clients/apple/build/*trollstore.ipa ios-dist/

      - name: Build iOS Jailbreak Deb (Optional)
        run: |
          python3 -c '
          import os
          pkg_sh = "clients/apple/Jailbreak/package.sh"
          if os.path.exists(pkg_sh):
              with open(pkg_sh, "r") as f:
                  s = f.read()
              s = s.replace("BASE_PACKAGE_IDENTIFIER=\"io.nekohasekai.sfajb\"", "BASE_PACKAGE_IDENTIFIER=\"io.nekohasekai.sfajb.hx\"")
              s = s.replace("APP_DISPLAY_NAME=\"sing-box JB\"", "APP_DISPLAY_NAME=\"sing-boxHX JB\"")
              s = s.replace("Name: sing-box JB", "Name: sing-boxHX JB")
              s = s.replace("SFI-${VERSION}-${architecture}.deb", "SFI-HX-${VERSION}-${architecture}.deb")
              s = s.replace("VERSION=\"$(awk", "VERSION=\"${CUSTOM_VERSION:-$(awk").replace("sing-box.xcodeproj/project.pbxproj)\"", "sing-box.xcodeproj/project.pbxproj)}\"")
              with open(pkg_sh, "w") as f:
                  f.write(s)
          '
          (CUSTOM_VERSION="${{ env.VERSION }}" make -C clients/apple build_ios_deb && cp clients/apple/build/jailbreak/*.deb ios-dist/) || echo "Jailbreak deb build skipped"

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-artifacts
          path: ios-dist/*

  build-android:
    name: Build Android APKs & Libbox.aar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: false

      - name: Setup OpenJDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28

      - name: Determine Version
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG_NAME="${{ github.event.inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
          else
            TAG_NAME="v1.14.4-hx.3"
          fi
          VERSION="${TAG_NAME#v}"
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build Libbox AAR slices
        run: |
          make lib_install
          export PATH="$PATH:$(go env GOPATH)/bin"
          mkdir -p libbox-slices
          for arch in arm64 arm amd64 386; do
            echo "Building libbox for android/$arch..."
            go run ./cmd/internal/build_libbox -target android -platform android/$arch
            mkdir -p libbox-slices/$arch
            mv libbox.aar libbox-legacy.aar libbox-slices/$arch/
          done
          mkdir -p clients/android/app/libs android-dist
          go run ./cmd/internal/merge_aar -output clients/android/app/libs/libbox.aar libbox-slices/*/libbox.aar
          go run ./cmd/internal/merge_aar -output clients/android/app/libs/libbox-legacy.aar libbox-slices/*/libbox-legacy.aar
          cp clients/android/app/libs/libbox.aar "android-dist/Libbox-HX-${VERSION}.aar"

      - name: Build Android CLI Core Binaries
        run: |
          set -xeuo pipefail
          go install -v ./cmd/internal/build
          export PATH="$PATH:$(go env GOPATH)/bin"
          if [ -n "${ANDROID_NDK_HOME:-}" ] && [ -d "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin" ]; then
            export PATH="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          fi

          TAGS=$(cat release/DEFAULT_BUILD_TAGS_OTHERS)
          LDFLAGS_SHARED=$(cat release/LDFLAGS)

          # Arch matrix: "goarch:goarm:ndk_target:out_arch"
          ARCH_CONFIGS=(
            "arm64::aarch64-linux-android23:arm64"
            "arm:7:armv7a-linux-androideabi23:arm"
            "amd64::x86_64-linux-android23:amd64"
            "386::i686-linux-android23:386"
          )

          mkdir -p android-cli-build android-dist
          for item in "${ARCH_CONFIGS[@]}"; do
            IFS=":" read -r g_arch g_arm ndk_target out_arch <<< "$item"
            echo "==> Compiling sing-box CLI binary for Android ($out_arch)..."

            DIR_NAME="sing-box-${VERSION}-android-${out_arch}"
            STAGE_DIR="android-cli-build/${DIR_NAME}"
            rm -rf "$STAGE_DIR"
            mkdir -p "$STAGE_DIR"

            export CC="${ndk_target}-clang"
            export CXX="${ndk_target}-clang++"
            export CGO_ENABLED=1
            export GOOS=android
            export GOARCH="${g_arch}"
            if [ -n "$g_arm" ]; then
              export GOARM="${g_arm}"
            else
              unset GOARM || true
            fi

            build go build -v -trimpath -tags "${TAGS}" \
              -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${VERSION}' ${LDFLAGS_SHARED} -s -w -buildid=" \
              -o "${STAGE_DIR}/sing-box" \
              ./cmd/sing-box

            cp LICENSE "${STAGE_DIR}/"
            tar -czvf "android-dist/${DIR_NAME}.tar.gz" -C android-cli-build "${DIR_NAME}"
          done
          rm -rf android-cli-build

      - name: Setup Keystore & Config for Android
        run: |
          # 1. Use the persistent sing-boxHX keystore to guarantee identical signatures across all updates
          cp .github/sing-box-hx.keystore clients/android/app/release.keystore
          cat > clients/android/local.properties <<EOF
          KEYSTORE_PASS=singbox
          ALIAS_NAME=sing-box
          ALIAS_PASS=singbox
          EOF

          # 3. Synchronize version.properties
          cat > clients/android/version.properties <<EOF
          VERSION_CODE=748
          VERSION_NAME=${VERSION}
          GO_VERSION=go1.26.10
          EOF

          # 4. Apply custom package name, app name, update check redirection & silent update prompt
          python3 -c '
          import glob

          with open("clients/android/app/build.gradle.kts", "r") as f:
              gradle_kts = f.read()
          gradle_kts = gradle_kts.replace(
              "applicationId = \"io.nekohasekai.sfa\"",
              "applicationId = \"io.nekohasekai.sfa.hx\""
          )
          gradle_kts = gradle_kts.replace(
              "base.archivesName.set(\"SFA-${versionName}\")",
              "base.archivesName.set(\"SFA-HX-${versionName}\")"
          )
          with open("clients/android/app/build.gradle.kts", "w") as f:
              f.write(gradle_kts)

          for s_file in glob.glob("clients/android/app/src/main/res/values*/strings.xml"):
              with open(s_file, "r") as f:
                  data = f.read()
              data = data.replace(
                  "<string name=\"app_name\" translatable=\"false\">sing-box</string>",
                  "<string name=\"app_name\" translatable=\"false\">sing-boxHX</string>"
              )
              with open(s_file, "w") as f:
                  f.write(data)

          # Redirect update check URL to ABOLUOmathh/sing-box releases
          checker_kt = "clients/android/app/src/github/java/io/nekohasekai/sfa/vendor/GitHubUpdateChecker.kt"
          with open(checker_kt, "r") as f:
              c_data = f.read()
          c_data = c_data.replace(
              "https://api.github.com/repos/SagerNet/sing-box/releases",
              "https://api.github.com/repos/ABOLUOmathh/sing-box/releases"
          )
          c_data = c_data.replace(
              "asset.name.endsWith(\".apk\") &&",
              "asset.name.endsWith(\".apk\") && (asset.name.contains(\"sing-boxHX\") || asset.name.contains(\"SFA\")) &&"
          )
          with open(checker_kt, "w") as f:
              f.write(c_data)

          # Redirect About / Source Repository URL
          settings_screen = "clients/android/app/src/main/java/io/nekohasekai/sfa/compose/screen/settings/SettingsScreen.kt"
          with open(settings_screen, "r") as f:
              s_data = f.read()
          s_data = s_data.replace(
              "https://github.com/SagerNet/sing-box-for-android",
              "https://github.com/ABOLUOmathh/sing-box"
          )
          with open(settings_screen, "w") as f:
              f.write(s_data)

          # Default updateCheckPrompted to true so it does not pop up asking user on launch
          settings_kt = "clients/android/app/src/main/java/io/nekohasekai/sfa/database/Settings.kt"
          with open(settings_kt, "r") as f:
              st_data = f.read()
          st_data = st_data.replace(
              "var updateCheckPrompted by dataStore.boolean(SettingsKey.UPDATE_CHECK_PROMPTED) { false }",
              "var updateCheckPrompted by dataStore.boolean(SettingsKey.UPDATE_CHECK_PROMPTED) { true }"
          )
          with open(settings_kt, "w") as f:
              f.write(st_data)

          print("Successfully configured Android package name, update redirection to ABOLUOmathh/sing-box, and silent prompt")
          '

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-provider: basic

      - name: Build Android Release APKs
        run: |
          go run -v ./cmd/internal/update_android_version --ci --nightly || true
          ROOT_DIR="$(pwd)"
          cd clients/android
          ./gradlew --build-cache --parallel :app:assembleOtherRelease
          cd "$ROOT_DIR"
          mkdir -p android-dist
          cd clients/android/app/build/outputs/apk/other/release/
          for apk in *.apk; do
            [ -f "$apk" ] || continue
            clean_name=$(echo "$apk" | sed 's/-other-release\.apk/\.apk/')
            cp "$apk" "$ROOT_DIR/android-dist/$clean_name"
          done
          cd "$ROOT_DIR"
          cat > "$ROOT_DIR/android-dist/SFA-version-metadata.json" << EOF
          {
            "version_code": 748,
            "version_name": "${VERSION}"
          }
          EOF
          ls -la android-dist/

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: android-dist/*

  build-core:
    name: Build Core - ${{ matrix.goos }}/${{ matrix.name_suffix || matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux 主流架构 (含 .deb / .rpm / .pkg.tar.zst / OpenWrt / Alpine)
          - { goos: linux, goarch: amd64, deb: amd64, rpm: x86_64, pacman: x86_64, alpine: x86_64, openwrt: "x86_64" }
          - { goos: linux, goarch: arm64, deb: arm64, rpm: aarch64, pacman: aarch64, alpine: aarch64, openwrt: "aarch64_cortex-a53 aarch64_cortex-a72 aarch64_cortex-a76 aarch64_generic" }
          - { goos: linux, goarch: "386", deb: i386, rpm: i386, alpine: x86, openwrt: "i386_pentium4" }
          - { goos: linux, goarch: arm, goarm: "7", deb: armhf, rpm: armv7hl, pacman: armv7hl, alpine: armv7, name_suffix: "armv7", openwrt: "arm_cortex-a5_vfpv4 arm_cortex-a7_neon-vfpv4 arm_cortex-a7_vfpv4 arm_cortex-a8_vfpv3 arm_cortex-a9_neon arm_cortex-a9_vfpv3-d16 arm_cortex-a15_neon-vfpv4" }
          - { goos: linux, goarch: arm, goarm: "6", deb: armel, rpm: armv6hl, name_suffix: "armv6", openwrt: "arm_arm1176jzf-s_vfp" }
          - { goos: linux, goarch: arm, goarm: "5", name_suffix: "armv5", openwrt: "arm_arm926ej-s arm_cortex-a7 arm_cortex-a9 arm_fa526 arm_xscale" }

          # Linux 路由器芯片 (MIPS 架构，含 OpenWrt 全微架构)
          - { goos: linux, goarch: mipsle, gomips: softfloat, deb: mipsel, rpm: mipsel, name_suffix: "mipsle-softfloat", openwrt: "mipsel_24kc mipsel_74kc mipsel_mips32" }
          - { goos: linux, goarch: mipsle, gomips: hardfloat, name_suffix: "mipsle-hardfloat", openwrt: "mipsel_24kc_24kf" }
          - { goos: linux, goarch: mips, gomips: softfloat, name_suffix: "mips-softfloat", openwrt: "mips_24kc mips_4kec mips_mips32" }
          - { goos: linux, goarch: mips64, gomips: softfloat, name_suffix: "mips64", openwrt: "mips64_mips64r2 mips64_octeonplus" }
          - { goos: linux, goarch: mips64le, gomips: hardfloat, name_suffix: "mips64le", openwrt: "mips64el_mips64r2" }

          # Linux 极客与新兴硬件
          - { goos: linux, goarch: riscv64, deb: riscv64, rpm: riscv64, alpine: riscv64, openwrt: "riscv64_generic" }
          - { goos: linux, goarch: loong64, deb: loongarch64, rpm: loongarch64, alpine: loongarch64, openwrt: "loongarch64_generic" }
          - { goos: linux, goarch: s390x, deb: s390x, rpm: s390x }
          - { goos: linux, goarch: ppc64le, deb: ppc64el, rpm: ppc64le }

          # Windows 全架构
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          - { goos: windows, goarch: "386" }

          # macOS Darwin
          - { goos: darwin, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }

          # BSD 家族
          - { goos: freebsd, goarch: amd64 }
          - { goos: freebsd, goarch: arm64 }
          - { goos: freebsd, goarch: "386" }
          - { goos: freebsd, goarch: arm, goarm: "7", name_suffix: "armv7" }
          - { goos: openbsd, goarch: amd64 }
          - { goos: openbsd, goarch: arm64 }

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: false

      - name: Determine Version
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG_NAME="${{ github.event.inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
          else
            TAG_NAME="v1.14.4-hx.3"
          fi
          VERSION="${TAG_NAME#v}"
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Compile sing-box binary
        run: |
          GOOS=${{ matrix.goos }}
          GOARCH=${{ matrix.goarch }}
          export GOOS GOARCH
          if [ -n "${{ matrix.goarm }}" ]; then
            export GOARM="${{ matrix.goarm }}"
          fi
          if [ -n "${{ matrix.gomips }}" ]; then
            export GOMIPS="${{ matrix.gomips }}"
          fi

          BINARY_NAME="sing-box"
          if [ "$GOOS" = "windows" ]; then
            BINARY_NAME="sing-box.exe"
          fi
          
          CGO_ENABLED=0 go build -v -trimpath \
            -tags "with_quic,with_wireguard,with_utls,with_clash_api,with_gvisor" \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${VERSION}' -s -w -buildid=" \
            -o "$BINARY_NAME" ./cmd/sing-box

          mkdir -p core-dist
          ARCH_LABEL="${{ matrix.name_suffix || matrix.goarch }}"
          PACKAGE_BASE="sing-box-${VERSION}-${GOOS}-${ARCH_LABEL}"
          if [ "$GOOS" = "windows" ]; then
            zip -j "core-dist/${PACKAGE_BASE}.zip" "$BINARY_NAME" LICENSE
          else
            tar -czvf "core-dist/${PACKAGE_BASE}.tar.gz" "$BINARY_NAME" LICENSE
          fi

      - name: Package DEB / RPM / IPK / APK / Pacman (if applicable)
        if: matrix.deb != '' || matrix.rpm != '' || matrix.openwrt != '' || matrix.pacman != '' || matrix.alpine != ''
        run: |
          sudo gem install --no-document fpm
          sudo apt-get update && sudo apt-get install -y libarchive-tools || true

          # Setup apk-tools for OpenWrt APK & Alpine APK
          if [ -n "${{ matrix.openwrt }}" ] || [ -n "${{ matrix.alpine }}" ]; then
            docker run --rm -v /usr/local/bin:/mnt alpine:edge sh -c "apk add --no-cache apk-tools-static && cp /sbin/apk.static /mnt/apk && chmod +x /mnt/apk" || true
          fi

          mkdir -p dist
          cp sing-box dist/
          PKG_VERSION="${VERSION}"

          # Package DEB
          if [ -n "${{ matrix.deb }}" ]; then
            cp .fpm_systemd .fpm
            fpm -t deb \
              -v "$PKG_VERSION" \
              -p "core-dist/sing-box_${VERSION}_linux_${{ matrix.deb }}.deb" \
              --architecture "${{ matrix.deb }}" \
              dist/sing-box=/usr/bin/sing-box
          fi

          # Package RPM
          if [ -n "${{ matrix.rpm }}" ]; then
            echo '%_rpmformat 4' > "$HOME/.rpmmacros"
            cp .fpm_systemd .fpm
            fpm -t rpm \
              -v "$PKG_VERSION" \
              -p "core-dist/sing-box_${VERSION}_linux_${{ matrix.rpm }}.rpm" \
              --architecture "${{ matrix.rpm }}" \
              dist/sing-box=/usr/bin/sing-box
          fi

          # Package Pacman (Arch Linux)
          if [ -n "${{ matrix.pacman }}" ]; then
            cp .fpm_pacman .fpm 2>/dev/null || true
            fpm -t pacman \
              -v "$PKG_VERSION" \
              -p "core-dist/sing-box_${VERSION}_linux_${{ matrix.pacman }}.pkg.tar.zst" \
              --architecture "${{ matrix.pacman }}" \
              dist/sing-box=/usr/bin/sing-box || true
          fi

          # Package OpenWrt IPK & APK
          if [ -n "${{ matrix.openwrt }}" ]; then
            cp .fpm_openwrt .fpm
            fpm -t deb \
              -v "$PKG_VERSION" \
              -p "dist/openwrt.deb" \
              --architecture all \
              dist/sing-box=/usr/bin/sing-box
            for arch in ${{ matrix.openwrt }}; do
              chmod +x .github/deb2ipk.sh
              .github/deb2ipk.sh "$arch" "dist/openwrt.deb" "core-dist/sing-box_${VERSION}_openwrt_${arch}.ipk"
              if [ -x /usr/local/bin/apk ]; then
                chmod +x .github/build_openwrt_apk.sh
                .github/build_openwrt_apk.sh "$arch" "$VERSION" "dist/sing-box" "core-dist/sing-box_${VERSION}_openwrt_${arch}.apk" || true
              fi
            done
            rm -f "dist/openwrt.deb"
          fi

          # Package Alpine APK
          if [ -n "${{ matrix.alpine }}" ] && [ -x /usr/local/bin/apk ]; then
            chmod +x .github/build_alpine_apk.sh
            .github/build_alpine_apk.sh "${{ matrix.alpine }}" "$VERSION" "dist/sing-box" "core-dist/sing-box_${VERSION}_linux_${{ matrix.alpine }}.apk" || true
          fi

      - name: Upload Core artifact
        uses: actions/upload-artifact@v4
        with:
          name: core-${{ matrix.goos }}-${{ matrix.name_suffix || matrix.goarch }}
          path: core-dist/*

  publish-release:
    name: Publish Full-Matrix GitHub Release
    runs-on: ubuntu-latest
    needs: [build-ios, build-android, build-core]
    if: always() && needs.build-ios.result == 'success' && needs.build-android.result == 'success' && (needs.build-core.result == 'success' || needs.build-core.result == 'failure')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Version
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG_NAME="${{ github.event.inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
          else
            TAG_NAME="v1.14.4-hx.3"
          fi
          VERSION="${TAG_NAME#v}"
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd release-artifacts
          sha256sum * > sha256sums.txt
          cat sha256sums.txt
          cd ..

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: sing-boxHX ${{ env.VERSION }} (Full Matrix Release)
          draft: false
          prerelease: false
          files: release-artifacts/*
          body: |
            ## sing-boxHX ${{ env.VERSION }} (Full-Matrix Release with Custom Branding)

            ### 🇨🇳 中文说明 (Chinese Description)
            基于官方 sing-box **v1.14.4** 深度适配四大专有协议，对齐官方标准实现 **全平台、全架构全量构建**（涵盖 iOS TrollStore 免签双开、Android 全架构客户端、Windows/macOS/Linux/BSD 及 OpenWrt 路由器全系资产，总计 140+ 产物）。

            #### 🏷️ 独立包名与应用名称（双开共存，互不干扰）
            - **iOS 苹果端**:
              - 巨魔免签 IPA: 包名 `io.nekohasekai.sfa.hx`，应用显示名称 `sing-boxHX`。
              - 越狱环境 DEB: 包名 `io.nekohasekai.sfajb.hx`，应用显示名称 `sing-boxHX JB`。
              - 内置 Ghostty 视觉主题与免断连 fallback 选择器，保留完整 VPN Entitlements 权限。
            - **Android 安卓端**:
              - 应用包名 (`applicationId`): `io.nekohasekai.sfa.hx`
              - 应用桌面显示名称: `sing-boxHX`
              - 各组件 Authority 全局隔离，可与官方 sing-box / SFA 原版完全并存双开，配置与签名互不干扰！
              - **应用内升级重定向**: 更新源已重定向至自定义 GitHub 仓库，提供 `SFA-version-metadata.json`，静默启动更新提示，避免误跳官方。

            #### 🌟 核心特性与适配协议 (Supported Protocols)
            1. **Enhanced VLESS (VLESS-EH)**
               - 支持 REALITY + xtls-rprx-vision 流控。
               - 内置 MD5 `e` 动态握手认证与服务端 `h` 令牌回写拦截更新。
               - 智能检测并抑制 `X25519MLKEM768` (ID 4588) 后量子扩展，防止 REALITY 首包被阻断。
            2. **OneSocks**
               - 原生实现自定义 AES-CTR 流加密与 MD5 密钥推导 (KDF)。
               - 包含 `MD5(password + "_onesocks")` 校验头与首包目的地址无缝写入。
               - 完整支持 Native UDP 报文与 UOT (UDP over TCP) 隧道。
            3. **HeySocks XHTTP**
               - 专有 xstream 传输协议，AES-128-CTR 加密。
               - 128 字节 fake-net bootstrap 引导帧握手。
               - 完整支持 TCP / Native UDP / UOT。
            4. **Shadowsocks 2022 (BLACKSTONE)**
               - 兼容 `2022-blake3-aes-128-gcm`。
               - 自动解析 `identityPSK:masterPSK#BLACKSTONE`。
               - 挂载 27 字节 fixedPlain 附带 `MD5(base64(masterPSK))` 校验头，缺少显式 UDP 配置时自动启用 UOT。
            5. **智能双通道真实测速**
               - 直连节点（`DIRECT`）自动测速百度（connect 延迟 10~25ms）。
               - 代理节点智能测速 Google gstatic（真实网络往返延迟 60~80ms）。

